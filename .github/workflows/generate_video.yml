name: Render Onion Rate Video

on:
  workflow_dispatch:
    inputs:
      video_data:
        description: 'Google Sheet JSON Data'
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install System Fonts & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-deva fonts-noto-extra ffmpeg

      - name: Install Project Dependencies
        run: npm install

      # n8n चा डेटा थेट src/data.json मध्ये सेव्ह करणे
      - name: Write Input Data to File
        run: |
          node -e '
            const fs = require("fs");
            const raw = process.env.INPUT_DATA;
            fs.writeFileSync("src/data.json", raw, "utf8");
          '
        env:
          INPUT_DATA: ${{ github.event.inputs.video_data }}

      # आता Remotion थेट त्या फाईलमधून १००% डेटा वाचेल
      - name: Render Remotion Video
        run: |
          npx remotion render src/index.ts OnionRateComposition out/video.mp4 --gl=angle

      - name: Upload Rendered Video
        uses: actions/upload-artifact@v4
        with:
          name: onion-rate-video
          path: out/video.mp4
