name: Render Onion Rate Video

on:
  workflow_dispatch:
    inputs:
      video_data:
        description: 'Google Sheet JSON Data'
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install System Fonts & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-deva fonts-noto-extra ffmpeg curl

      - name: Install Project Dependencies
        run: npm install

      # १. इनपुट डेटा सेव्ह करणे
      - name: Write Input Data to File
        run: |
          node -e '
            const fs = require("fs");
            const raw = process.env.INPUT_DATA;
            fs.writeFileSync("src/data.json", raw, "utf8");
          '
        env:
          INPUT_DATA: ${{ github.event.inputs.video_data }}

      # २. टॉप ट्रेंडिंग कॉपीराइट-फ्री मोटिव्हेशनल म्युझिक थेट public फोल्डरमध्ये ऑटो-डाऊनलोड करणे
      - name: Download Trending Copyright-Free Music
        run: |
          mkdir -p public
          # YouTube आणि FB साठी सुरक्षित हाय-एनर्जी मोटिव्हेशनल ट्रॅक
          curl -L "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3" -o public/bg-music.mp3

      # ३. व्हिडिओ रेंडर करणे
      - name: Render Remotion Video
        run: |
          npx remotion render src/index.ts OnionRateComposition out/video.mp4 --gl=angle

      # ४. तयार व्हिडिओ सेव्ह करणे
      - name: Upload Rendered Video
        uses: actions/upload-artifact@v4
        with:
          name: onion-rate-video
          path: out/video.mp4
